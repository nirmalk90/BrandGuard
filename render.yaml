services:
  - type: web
    name: brandguard-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brandguard-db
          property: connectionString
      - key: SECURE_COOKIES
        value: "1"

databases:
  - name: brandguard-db
    plan: free
    ipAllowList: []
