services:
  - type: web
    name: brandguard-ai
    runtime: docker
    plan: 1c-2g
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brandguard-db
          property: connectionString
      - key: SECURE_COOKIES
        value: "1"
      - key: BRANDGUARD_MODE
        value: team

databases:
  - name: brandguard-db
    plan: 0.1c-256mb
    ipAllowList: []
